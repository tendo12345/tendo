<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The mark on a parchment ground, generated from brand/basis-logo-master.png by
      scripts/build-brand.py. PNG rather than SVG because the mark is a shaded 3D render:
      there is no vector of it that looks like it.

      The ground is not padding. A tab strip is the one surface the mark cannot choose, and
      the cluster contains both a cream cube and a near-black one — on Chrome's near-white
      strip the first disappears, on Safari's dark one the second does. Parchment behind it
      keeps every block for every browser.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basis — Design System Generator</title>
    <meta name="description" content="Turn a product idea into a complete design system: colors, typography, spacing, components, and the reasoning behind each choice." />
    <!--
      Light and dark follow the browser or device. This tells the UA the page genuinely supports
      both, so form controls, scrollbars and the canvas flash the right colour before any CSS
      loads — without it, a dark-mode visitor gets a white flash on first paint.

      The inline script that used to sit here read a stored `dsg-theme` and set `data-theme` on
      the root. With the theme toggle gone nothing writes that key and no selector reads the
      attribute, so the script only ever produced a misleading attribute for anyone inspecting
      the page. Any value still in a returning visitor's localStorage is now inert.
    -->
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
